
name: Security Scan

on:
  pull_request:
    branches:
      - '*'

jobs:

  cfn-lint-cfn-nag-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Git clone the repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
      - name: Install CFN tools
        run: |
          gem install cfn-nag
      - name: Install cfn-lint
        run: |
          # Pin checkov so a new release can't break CI; let it pick its own cyclonedx-python-lib.
          # (The old cyclonedx-python-lib==5.2.0 pin for checkov#5841 breaks checkov 3.4+, which needs >=8.)
          pip install cfn-lint checkov==3.4.8
          # pyston-autoload (a checkov dependency on Python 3.10) can't load on the runner; remove it to silence the .pth error.
          pip uninstall -y pyston-autoload pyston
      - name: Scan all templates
        run: |
          utils/lint.sh
