      DatabaseName: !Ref DatabaseName
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DestinationBucket}/${CFDataName}/${CFDataName}-tasks-data/"
          - Path: !Sub "s3://${DestinationBucket}/${CFDataName}/${CFDataName}-journal-records-data/"
          - Path: !Sub "s3://${DestinationBucket}/${CFDataName}/${CFDataName}-tool-usage-data/"
          - Path: !Sub "s3://${DestinationBucket}/${CFDataName}/${CFDataName}-account-usage-data/"
      Configuration: |
        {
          "Version": 1.0,
          "Grouping": {
            "TableGroupingPolicy": "CombineCompatibleSchemas"
          },
          "CrawlerOutput": {
            "Partitions": {
              "AddOrUpdateBehavior": "InheritFromTable"
            },
            "Tables": {
              "TableThreshold": 4,
              "AddOrUpdateBehavior": "MergeNewColumns"
            }
          }
        }
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

