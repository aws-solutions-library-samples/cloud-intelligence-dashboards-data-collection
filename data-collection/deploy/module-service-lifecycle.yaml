AWSTemplateFormatVersion: "2010-09-09"
Description: Retrieves AWS service lifecycle data (end of support, end of life, recommended versions) from the AWS organization payer accounts
Parameters:
  DatabaseName:
    Type: String
    Description: Name of the Athena database to be created to hold lambda information
    Default: optimization_data
  DestinationBucket:
    Type: String
    Description: Name of the S3 Bucket that exists or needs to be created to hold service lifecycle information
    AllowedPattern: (?=^.{3,63}$)(?!^(\d+\.)+\d+$)(^(([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])\.)*([a-z0-9]|[a-z0-9][a-z0-9\-]*[a-z0-9])$)
  DestinationBucketARN:
    Type: String
    Description: ARN of the S3 Bucket that exists or needs to be created to hold service lifecycle information
  ManagementRoleName:
    Type: String
    Description: The name of the IAM role that will be deployed in the management account which can retrieve AWS Organization data. KEEP THE SAME AS WHAT IS DEPLOYED INTO MANAGEMENT ACCOUNT
  CFDataName:
    Type: String
    Description: The name of what this cf is doing.
    Default: service-lifecycle
  Schedule:
    Type: String
    Description: EventBridge Schedule to trigger the data collection
    Default: "rate(1 day)"
  ResourcePrefix:
    Type: String
    Description: This prefix will be placed in front of all roles created. Note you may wish to add a dash at the end to make more readable
  LambdaAnalyticsARN:
    Type: String
    Description: Arn of lambda for Analytics
  AccountCollectorLambdaARN:
    Type: String
    Description: Arn of the Account Collector Lambda
  CodeBucket:
    Type: String
    Description: Source code bucket
  StepFunctionTemplate:
    Type: String
    Description: JSON representation of common StepFunction template
  StepFunctionExecutionRoleARN:
    Type: String
    Description: Common role for Step Function execution
  SchedulerExecutionRoleARN:
    Type: String
    Description: Common role for module Scheduler execution
  DataBucketsKmsKeysArns:
    Type: String
    Description: "ARNs of KMS Keys for data buckets and/or Glue Catalog. Comma separated list, no spaces. Keep empty if data Buckets and Glue Catalog are not Encrypted with KMS. You can also set it to '*' to grant decrypt permission for all the keys."
    Default: ""
  Boto3LayerArn:
    Type: String
    Description: "ARN of the Boto3 Lambda Layer"
    Default: ""
  CommonLayerArn:
    Type: String
    Description: ARN of the CID common Lambda Layer, created by the data collection stack

Conditions:
  NeedDataBucketsKms: !Not [ !Equals [ !Ref DataBucketsKmsKeysArns, "" ] ]
  UseBoto3Layer: !Not [ !Equals [ !Ref Boto3LayerArn, "" ] ]

Outputs:
  StepFunctionARN:
    Description: ARN for the module's Step Function
    Value: !GetAtt ModuleStepFunction.Arn

Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourcePrefix}${CFDataName}-LambdaRole"
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - !Sub "lambda.${AWS::URLSuffix}"
        Version: 2012-10-17
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Path: /
      Policies:
        - PolicyName: !Sub "${CFDataName}-ManagementAccount-LambdaRole"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "sts:AssumeRole"
                Resource: !Sub "arn:${AWS::Partition}:iam::*:role/${ManagementRoleName}" # Need to assume a Read role in all Management accounts
        - !If
          - NeedDataBucketsKms
          - PolicyName: "KMS"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: "Allow"
                  Action:
                    - "kms:GenerateDataKey"
                  Resource: !Split [ ',', !Ref DataBucketsKmsKeysArns ]
          - !Ref AWS::NoValue
        - PolicyName: "S3-Access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "s3:PutObject"
                Resource:
                  - !Sub "${DestinationBucketARN}/*" # module data and the logs/modules/ monitor entries
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28 # Resource found with an explicit name, this disallows updates that require replacement of this resource
            reason: "Need explicit name to identify role actions"

  # Built on the common Lambda layer; writes to a pre-created table with
  # partition projection, so no crawler is needed.
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ResourcePrefix}${CFDataName}-Lambda'
      Description: !Sub "Lambda function to retrieve ${CFDataName}"
      Runtime: python3.13
      Architectures: [x86_64]
      # The boto3 layer supplies a botocore recent enough for DescribeServiceLifecycle
      Layers: !If
        - UseBoto3Layer
        - [!Ref Boto3LayerArn, !Ref CommonLayerArn]
        - [!Ref CommonLayerArn]
      Code:
        ZipFile: |
          """ Service Lifecycle: AWS service lifecycle catalog, built on the common layer.

          Collects the AWS Health service lifecycle catalog (health:DescribeServiceLifecycle):
          end-of-support, end-of-life and extended-support dates, plus recommended
          versions, for services such as RDS, EKS, Lambda, OpenSearch and Bedrock.
          Assumes ROLE_NAME in the payer account and writes one file per payer per day:

            <prefix>/<prefix>-catalog-data/year=YYYY/month=MM/day=DD/<payer_id>_YYYY_MM_DD.json
          """
          from common.context import Collector
          from common.module import DataCollectionModule
          from common.record_schema import RecordSchema
          from common.utils import GLOBAL_REGION, DcUtils

          # Output columns in table order. Must match the catalog table columns
          # in module-service-lifecycle.yaml. Types follow the API shape: compound values stay struct/array.
          CATALOG_SCHEMA = RecordSchema({
              "service": "string",
              "version": "string",
              "title": "string",
              "recommendedVersion": "string",
              "lifecycleEvents": "array<struct<lifecycleEventType:string,effective_date:timestamp,regions:array<string>,impactRisks:array<string>,description:string>>",
              "payer_id": "string",
              "collection_time": "timestamp",
          })


          def collect_catalog(ctx):
              """Return every service lifecycle entry, one record per service version."""
              # The Health API is served from the partition's global endpoint region
              paginator = ctx.client("health", region=GLOBAL_REGION).get_paginator("describe_service_lifecycle")
              items = [item for page in paginator.paginate() for item in page["serviceLifecycles"]]
              for item in items:
                  for event in item.get("lifecycleEvents") or []:
                      # "date" is a reserved word in Athena; it is the day the event takes effect
                      event["effective_date"] = event.pop("date", None)
              return items


          class ServiceLifecycleModule(DataCollectionModule):
              """Service lifecycle module, catalog collector."""

              MODULE = "service-lifecycle"
              COLLECTORS = (Collector("catalog", collect_catalog, scope=Collector.GLOBAL),)

              def output_key(self, name, region):  # pylint: disable=unused-argument
                  # The catalog is not regional, so one file per payer per day
                  return DcUtils.date_partitioned_key(
                      self.mod_ctx.prefix, name, self.exec_ctx.ingestion_time, self.exec_ctx.payer_id)

              def conform(self, name, records):  # pylint: disable=unused-argument
                  return CATALOG_SCHEMA.conform_all(records)


          def lambda_handler(event, context):
              return ServiceLifecycleModule(event, context).run()
      Handler: 'index.lambda_handler'
      MemorySize: 512
      Timeout: 300
      Role: !GetAtt LambdaRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref DestinationBucket
          PREFIX: !Ref CFDataName
          ROLE_NAME: !Ref ManagementRoleName
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89 # Lambda functions should be deployed inside a VPC
            reason: "No need for VPC in this case"
          - id: W92 #  Lambda functions should define ReservedConcurrentExecutions to reserve simultaneous executions
            reason: "No need for simultaneous execution"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunction}"
      RetentionInDays: 60

  # Pre-created table with partition projection: Athena computes the
  # year/month/day partitions from storage.location.template, so no crawler
  # and no partition maintenance are needed.
  CatalogTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref DatabaseName
      TableInput:
        Name: service_lifecycle_catalog_data
        Description: AWS service lifecycle catalog (end of support, end of life, recommended versions)
        TableType: EXTERNAL_TABLE
        PartitionKeys:
          - { Name: year,  Type: string }
          - { Name: month, Type: string }
          - { Name: day,   Type: string }
        StorageDescriptor:
          Columns:
            - { Name: service,            Type: string }
            - { Name: version,            Type: string }
            - { Name: title,              Type: string }
            - { Name: recommendedversion, Type: string }
            - { Name: lifecycleevents,    Type: "array<struct<lifecycleeventtype:string,effective_date:timestamp,regions:array<string>,impactrisks:array<string>,description:string>>" }
            - { Name: payer_id,           Type: string }
            - { Name: collection_time,    Type: timestamp }
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          Location: !Sub "s3://${DestinationBucket}/${CFDataName}/${CFDataName}-catalog-data/"
          SerdeInfo:
            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe
            Parameters:
              serialization.format: '1'
        Parameters:
          EXTERNAL: 'TRUE'
          classification: json
          compressionType: none
          projection.enabled: 'true'
          projection.year.type: integer
          projection.year.range: '2025,2099'
          projection.month.type: integer
          projection.month.range: '1,12'
          projection.month.digits: '2'
          projection.day.type: integer
          projection.day.range: '1,31'
          projection.day.digits: '2'
          storage.location.template: !Sub "s3://${DestinationBucket}/${CFDataName}/${CFDataName}-catalog-data/year=${!year}/month=${!month}/day=${!day}/"

  ModuleStepFunction:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ResourcePrefix}${CFDataName}-StateMachine'
      StateMachineType: STANDARD
      RoleArn: !Ref StepFunctionExecutionRoleARN
      DefinitionS3Location:
        Bucket: !Ref CodeBucket
        Key: !Ref StepFunctionTemplate
      DefinitionSubstitutions:
        AccountCollectorLambdaARN: !Ref AccountCollectorLambdaARN
        ModuleLambdaARN: !GetAtt LambdaFunction.Arn
        Crawlers: '[]' # partition projection, no crawler
        CollectionType: "Payers"
        Params: ''
        Module: !Ref CFDataName # the state machine invokes <Prefix><Module>-Lambda
        DeployRegion: !Ref AWS::Region
        Account: !Ref AWS::AccountId
        Prefix: !Ref ResourcePrefix
        Bucket: !Ref DestinationBucket

  ModuleRefreshSchedule:
    Type: 'AWS::Scheduler::Schedule'
    Properties:
      Description: !Sub 'Scheduler for the ODC ${CFDataName} module'
      Name: !Sub '${ResourcePrefix}${CFDataName}-RefreshSchedule'
      ScheduleExpression: !Ref Schedule
      State: ENABLED
      FlexibleTimeWindow:
        MaximumWindowInMinutes: 30
        Mode: 'FLEXIBLE'
      Target:
        Arn: !GetAtt ModuleStepFunction.Arn
        RoleArn: !Ref SchedulerExecutionRoleARN

  AnalyticsExecutor:
    Type: Custom::LambdaAnalyticsExecutor
    Properties:
      ServiceToken: !Ref LambdaAnalyticsARN
      Name: !Ref CFDataName
